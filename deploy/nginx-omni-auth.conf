# nginx reverse proxy para el auth-server (VPS).
# Colocar en /etc/nginx/sites-available/omni-auth.conf y enlazar a sites-enabled.
# Certificado: certbot --nginx -d fenixdev.cloud -d www.fenixdev.cloud

server {
    listen 80;
    server_name fenixdev.cloud www.fenixdev.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fenixdev.cloud www.fenixdev.cloud;

    # ssl_certificate     /etc/letsencrypt/live/fenixdev.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fenixdev.cloud/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
